apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: billing
  description: QA fixture - the billing system both services belong to, owned by qa-platform.
spec:
  owner: qa-platform
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: billing-service
  description: QA fixture - billing service called by shop.
  annotations:
    # Root of this repository; invoice-archive below owns its own subdirectory.
    backstage.io/source-location: url:https://github.com/StackRailsAI/qa-dep-demo-billing/tree/main
spec:
  type: service
  lifecycle: experimental
  owner: qa-platform
  system: billing
  # A declared dependency, so the graph has a component with known DEPENDS_ON targets.
  dependsOn:
    - component:invoice-archive
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: invoice-archive
  description: QA fixture - a second service that also serves POST /refunds, so shop's call to it is ambiguous by route.
  annotations:
    backstage.io/source-location: url:https://github.com/StackRailsAI/qa-dep-demo-billing/tree/main/invoice-archive
spec:
  type: service
  lifecycle: experimental
  owner: qa-platform
  system: billing
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: qa-platform
  description: QA fixture - the team that owns the billing system. Declared here because an owner the catalog never declares is dropped as unknown, leaving the system with no owning team.
spec:
  type: team
  children: []
